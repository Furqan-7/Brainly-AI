<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brainly is offline</title>
  <style>
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #faf5f2 radial-gradient(#e7ddd7 1.15px, transparent 1.35px) 0 0 / 7px 7px; color: #141414; font: 15px/1.6 system-ui, sans-serif; }
    main { max-width: 340px; margin: 16px; padding: 28px; text-align: center; background: #fffcf9; border: 1px solid #e4ddd8; border-radius: 22px; }
    h1 { font: 400 26px Georgia, serif; margin: 12px 0 6px; }
    p { color: #6d6966; margin: 0 0 18px; }
    button { cursor: pointer; border: 0; border-radius: 12px; padding: 11px 18px; background: #1e1e1e; color: #fff; font: 500 14px system-ui, sans-serif; }
    .mark { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 16px; background: #f8ddd2; color: #b4472b; font-size: 22px; }
  </style>
</head>
<body>
  <main>
    <span class="mark">✦</span>
    <h1>You're offline</h1>
    <p>Brainly needs a connection to reach your memories. Anything you shared will save once you're back online and share it again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
