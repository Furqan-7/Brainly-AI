name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brainly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brainly_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/brainly_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brainly_test
      DISABLE_WORKER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build db package and apply migrations
        run: |
          pnpm --filter db build
          pnpm --filter db exec prisma migrate deploy

      - name: Backend typecheck
        run: pnpm --filter backend typecheck

      - name: Backend tests (unit + integration against Postgres)
        run: pnpm --filter backend test

      - name: Frontend lint
        run: pnpm --filter frontend lint

      - name: Frontend build
        run: pnpm --filter frontend build
        env:
          BACKEND_URL: http://localhost:3001
